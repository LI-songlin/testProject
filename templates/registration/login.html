<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Login</title>
</head>
<body>
  <h1>ログイン</h1>

  {% if form.errors %}
    <p style="color:red;">ユーザー名またはパスワードが正しくありません。</p >
  {% endif %}

  {% if next %}
    <p>ログインが必要です。</p >
  {% endif %}

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">ログイン</button>
  </form>
</body>
</html>
